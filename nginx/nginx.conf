worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens off;

    # Web 日誌格式（含時間、IP、請求、狀態碼、回應大小）
    log_format main '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 100m;

    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream kpi_web {
        server kpi-web:3000;
    }

    upstream forma_app {
        server forma:8080;
    }

    upstream kpi_api {
        server kpibackend:8080;
    }

    server {
        listen 80;
        server_name _;

        # ── 統一由 nginx 管理 Security Headers（涵蓋所有 location）──
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN"                                   always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header X-XSS-Protection          "0"                                            always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

        # ── 防止 Next.js upstream 的同名 header 重複出現 ──
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;

        location = / {
            return 301 /iskpi;
        }

        location /iskpi {
            proxy_pass         http://kpi_web;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /iskpi/forma/kpi-auth/ {
            proxy_pass         http://kpi_api/Auth/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /iskpi/forma/ {
            proxy_pass         http://forma_app/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /iskpi/forma {
            return 301 /iskpi/forma/;
        }
    }
}
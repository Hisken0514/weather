services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345!"
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  backend:
    image: ghcr.io/hisken0514/weather/backend:latest
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=testdb;Username=postgres;Password=12345!"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    image: ghcr.io/hisken0514/weather/frontend:latest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    restart: always

volumes:
  pg_data_prod:
